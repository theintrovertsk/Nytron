name: Build Nytron APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libltdl-dev build-essential gettext libltdl7

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37
          pip install buildozer

      - name: Accept Android licenses
        run: |
          mkdir -p $HOME/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List output
        if: always()
        run: |
          find . -name "*.apk" -ls || true
          ls -la bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nytron-apk
          path: bin/*.apk
          if-no-files-found: warn
